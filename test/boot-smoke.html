<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Pixel Music boot check</title>
    <style>
        body { font: 13px/1.4 monospace; background: #0b0f14; color: #d7e2ea; margin: 0; padding: 16px; }
        h1 { font-size: 15px; margin: 0 0 12px; }
        #result { white-space: pre-wrap; margin: 0; }
        .ok { color: #4ade80; }
        .bad { color: #f87171; }
        iframe { position: fixed; left: -10000px; top: 0; width: 1280px; height: 800px; border: 0; }
    </style>
</head>
<body>
    <h1>Pixel Music boot check</h1>
    <pre id="result">running…</pre>
    <iframe id="app" src="../index.html" title="app under test"></iframe>

    <script>
        // Loads the real app in an iframe and reports what actually got wired up.
        // Serve the repository over HTTP and open /test/boot-smoke.html.
        const results = [];

        function check(name, fn) {
            try {
                const value = fn();
                results.push(`ok   ${name}${value === true || value === undefined ? '' : ` -> ${value}`}`);
            } catch (error) {
                results.push(`FAIL ${name}: ${error.message}`);
            }
        }

        function render() {
            const failures = results.filter(r => r.startsWith('FAIL'));
            const pre = document.getElementById('result');
            pre.textContent = results.join('\n') + `\n\n${failures.length} failure(s)`;
            pre.className = failures.length ? 'bad' : 'ok';
            // Also mirror the verdict into the title so a harness can read it
            // without scraping the page.
            document.title = failures.length
                ? `FAIL ${failures.length} | ${failures.map(f => f.replace(/^FAIL /, '')).join(' | ')}`
                : `ok ${results.length} / fail 0`;

            // ?report=1 writes the log as a download, so a headless harness can
            // read it without scraping the page.
            if (new URLSearchParams(location.search).has('report')) {
                const blob = new Blob([pre.textContent], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'boot-results.txt';
                document.body.appendChild(link);
                link.click();
            }
        }

        // Cache-bust so the iframe never runs a stale copy of index.html.
        const frame = document.getElementById('app');

        // Re-fetch the app modules bypassing the HTTP cache; index.html itself is
        // cache-busted with a query string, but script URLs stay stable.
        const modules = [
            '../js/nodeProperties.js',
            '../js/nodeCodegen.js',
            '../js/nodes/NodeCanvas.js',
            '../js/nodes/ConnectionManager.js',
            '../js/nodes/NodeFactory.js',
            '../js/nodes/NodeAudio.js',
            '../js/nodes/NodeManager.js',
            '../js/strudelPatternGenerator.js',
            '../js/projectManager.js',
            '../js/appWiring.js',
            '../js/sampleTunes.js',
            '../js/nodeContextMenu.js',
            '../js/menuLoader.js',
            '../js/ai-creator.js',
            '../nodes/strudel-node-schema.json',
            '../nodes/strudel-node-properties.json',
            '../nodes/strudel-control-nodes.json',
            '../nodes/strudel-pattern-combinators.json',
            '../nodes/strudel-pattern-functions.json',
            '../nodes/strudel-mini-notation.json',
            '../nodes/strudel-node-instruments.json'
        ];
        Promise.all(modules.map(url => fetch(url, { cache: 'reload' }))).finally(() => {
            frame.src = `../index.html?_smoke=${Date.now()}`;
        });

        frame.addEventListener('load', () => {
            setTimeout(() => {
                const win = document.getElementById('app').contentWindow;
                const doc = win.document;

                check('nodeManager exists', () => !!win.nodeManager);
                check('app scripts are loaded', () => {
                    const srcs = [...doc.querySelectorAll('script[src]')].map(s => s.getAttribute('src').split('?')[0]);
                    ['js/projectManager.js', 'js/settingsCodegen.js', 'js/appWiring.js', 'js/sampleTunes.js', 'js/nodeContextMenu.js', 'js/nodes/NodeManager.js'].forEach(required => {
                        if (!srcs.includes(required)) throw new Error(`index.html does not load ${required}`);
                    });
                    return srcs.length;
                });
                check('logo uses the Press Start 2P font', () => {
                    const logo = doc.querySelector('.logo-area h1');
                    if (!logo) throw new Error('no logo');
                    const family = win.getComputedStyle(logo).fontFamily;
                    if (!/Press Start 2P/i.test(family)) throw new Error(`logo font is ${family}`);
                    if (!win.document.fonts.check('16px "Press Start 2P"')) {
                        throw new Error('Press Start 2P did not load');
                    }
                    return family;
                });
                check('projectManager exists', () => !!win.projectManager);
                check('AI apply adapter exists', () => typeof win.PixelAIApply_pixelMusic === 'function');
                check('settings modal opens on click', () => {
                    const button = doc.getElementById('settingsBtn');
                    if (!button) throw new Error('no settings button');
                    button.click();
                    if (!doc.getElementById('settings-modal').classList.contains('open')) throw new Error('modal did not open');
                    return true;
                });
                check('save button is wired', () => {
                    const button = doc.getElementById('saveProject');
                    if (!button) throw new Error('no save button');
                    // ProjectManager binds a click listener; a click with no nodes still updates status.
                    button.click();
                    return true;
                });
                check('AI settings panel sits before the modal footer', () => {
                    const tab = [...doc.querySelectorAll('.settings-tab')]
                        .find(item => /^AI$/i.test(item.textContent.trim()));
                    if (!tab) throw new Error('no AI settings tab');
                    const panel = doc.querySelector('[data-pixel-ai-panel]');
                    if (!panel) throw new Error('no AI settings panel');
                    const footer = doc.querySelector('#settings-modal .modal-actions');
                    if (!footer) throw new Error('no settings footer');
                    if (panel.nextElementSibling !== footer) {
                        throw new Error('AI panel is not immediately before the settings footer');
                    }
                    return true;
                });
                check('build-nodes button is present', () => !!doc.getElementById('build-nodes-from-pattern'));
                check('schemas loaded', () => {
                    const manager = win.nodeManager;
                    const state = {
                        nodeSchema: !!manager.nodeSchema,
                        propertySchema: !!manager.propertySchema,
                        combinators: !!manager.patternCombinatorsSchema,
                        instruments: manager.instrumentList.length
                    };
                    if (!state.nodeSchema || !state.propertySchema || !state.instruments) {
                        throw new Error(JSON.stringify(state));
                    }
                    return `${state.instruments} instruments`;
                });
                check('only one node manager instance is listening', () => {
                    const manager = win.nodeManager;
                    if (!manager) throw new Error('node manager missing');
                    return true;
                });
                check('instrument palette rendered', () => {
                    const items = doc.querySelectorAll('.instrument-item');
                    if (!items.length) throw new Error('no instrument items');
                    return items.length;
                });
                check('typing in the pattern field does not clear nodes', () => {
                    const input = doc.getElementById('strudel-example-input');
                    const manager = win.nodeManager;
                    const first = doc.querySelector('.instrument-item');
                    if (!input || !first) throw new Error('missing input or palette item');
                    first.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
                    const before = manager.factory.nodes.length;
                    if (!before) throw new Error('click did not create a node');
                    input.value = 's("bd sd")';
                    input.dispatchEvent(new win.Event('input', { bubbles: true }));
                    const after = manager.factory.nodes.length;
                    if (after !== before) throw new Error(`node count changed ${before} -> ${after}`);
                    return `${before} node(s) kept`;
                });
                check('generated code for the created node', () => {
                    const manager = win.nodeManager;
                    const code = manager.buildPlayablePattern();
                    if (!code) throw new Error('no code generated');
                    return code;
                });
                check('export produces a project snapshot', () => {
                    const project = win.projectManager.serialize();
                    if (project.format !== 'pixelmusic-project') throw new Error('wrong format');
                    if (!project.nodes.length) throw new Error('no nodes in snapshot');
                    return `${project.nodes.length} node(s)`;
                });
                check('schema-driven modules are loaded', () => {
                    if (typeof win.NodeCodegen !== 'function') throw new Error('NodeCodegen missing');
                    if (!win.NodeProperties || typeof win.NodeProperties.collect !== 'function') {
                        throw new Error('NodeProperties missing');
                    }
                    if (!win.SettingsCodegen || typeof win.SettingsCodegen.masterChain !== 'function') {
                        throw new Error('SettingsCodegen missing');
                    }
                    return true;
                });
                check('every schema node type passes validation', () => {
                    const manager = win.nodeManager;
                    const issues = manager.schemaIssues || [];
                    if (issues.length) throw new Error(issues.join('; '));
                    return '0 issues';
                });
                check('effect nodes generate method + argument code', () => {
                    const manager = win.nodeManager;
                    manager.clearAllNodes();
                    const drum = manager.createNode('DrumSymbol', 'bd', 80, 80);
                    const effect = manager.createNode('Effect', 'lpf', 380, 80);
                    effect.properties.strudelProperties = { ...(effect.properties.strudelProperties || {}), frequency: 500 };
                    manager.createConnection(drum.id, 'output', effect.id, 'input');
                    const code = manager.buildPlayablePattern();
                    if (!/\.lpf\(500\)/.test(code)) throw new Error(`unexpected code: ${code}`);
                    return code;
                });
                check('dragging a schema slider changes the generated code', () => {
                    const manager = win.nodeManager;
                    const node = manager.factory.nodes.find(n => n.type === 'Effect');
                    if (!node) throw new Error('no effect node');
                    manager.factory.renderSchemaProperties(node);
                    const slider = doc.querySelector('#schema-properties-container input[type="range"]');
                    if (!slider) throw new Error('no slider for the effect');
                    slider.value = '1200';
                    slider.dispatchEvent(new win.Event('input', { bubbles: true }));
                    const code = manager.buildPlayablePattern();
                    if (!/\.lpf\(1200\)/.test(code)) throw new Error(`slider had no effect: ${code}`);
                    return code;
                });
                check('property panel is rendered from the schema', () => {
                    const manager = win.nodeManager;
                    const node = manager.factory.nodes.find(n => n.type === 'Effect');
                    if (!node) throw new Error('no effect node');
                    manager.factory.showSidePanel ? manager.factory.showSidePanel(node) : null;
                    manager.factory.renderSchemaProperties(node);
                    const container = doc.getElementById('schema-properties-container');
                    if (!container) throw new Error('no properties container');
                    const controls = container.querySelectorAll('input, select, textarea, button');
                    if (!controls.length) throw new Error('no controls rendered');
                    return `${controls.length} control(s)`;
                });
                check('palette is derived from the instruments JSON', () => {
                    const loader = win.menuLoader || win.menuManager;
                    const menuData = loader?.menuData || win.nodeManager?.menuData;
                    if (!menuData || !menuData.menus || !menuData.menus.length) {
                        throw new Error('menu data was not loaded from JSON');
                    }
                    const items = doc.querySelectorAll('.instrument-item').length;
                    if (!items) throw new Error('no palette items rendered');
                    const groups = doc.querySelectorAll('#instrument-content .instrument-group').length;
                    return `${items} items in ${groups} group(s)`;
                });
                check('sample tune button loads a playable graph', () => {
                    const button = doc.getElementById('load-sample-tune');
                    if (!button) throw new Error('no sample tune button');
                    win.confirm = () => true;
                    button.click();
                    const manager = win.nodeManager;
                    if (!manager.factory.nodes.length) throw new Error('no nodes created');
                    const code = manager.buildPlayablePattern();
                    if (!code.trim()) throw new Error('no code generated');
                    try {
                        new win.Function(code);
                    } catch (error) {
                        throw new Error(`sample tune code is not valid JavaScript: ${error.message} (${code})`);
                    }
                    return `${manager.factory.nodes.length} node(s): ${code.split('\n').join(' ')}`;
                });
                check('fit view frames all nodes', () => {
                    const button = doc.getElementById('fit-view');
                    if (!button) throw new Error('no fit view button');
                    button.click();

                    const manager = win.nodeManager;
                    const canvas = doc.getElementById('canvas-content');
                    const viewport = doc.getElementById('node-canvas').getBoundingClientRect();
                    const nodes = [...canvas.querySelectorAll('.node')];
                    if (!nodes.length) throw new Error('no nodes to fit');

                    const scale = manager.canvas.scale;
                    if (!(scale >= 0.1 && scale <= 1)) throw new Error(`bad fit scale ${scale}`);
                    if (!Number.isFinite(manager.canvas.offsetX) || !Number.isFinite(manager.canvas.offsetY)) {
                        throw new Error('fit offsets are not finite');
                    }

                    nodes.forEach(element => {
                        const box = element.getBoundingClientRect();
                        if (box.left < viewport.left - 2 || box.top < viewport.top - 2 ||
                            box.right > viewport.right + 2 || box.bottom > viewport.bottom + 2) {
                            throw new Error(`node ${element.id} is outside the viewport after fit`);
                        }
                    });

                    const label = doc.getElementById('zoom-level').textContent;
                    if (label !== `${Math.round(scale * 100)}%`) {
                        throw new Error(`zoom label ${label} does not match ${scale}`);
                    }
                    return `${nodes.length} node(s) at ${label}`;
                });
                check('left palette collapses and reopens from its icon', () => {
                    const tab = doc.querySelector('.category-sidebar-tab.active');
                    const panel = doc.getElementById('fixed-tools-panel');
                    if (!tab || !panel) throw new Error('missing palette tab or panel');
                    const previousTransition = panel.style.transition;
                    panel.style.transition = 'none';
                    if (panel.classList.contains('collapsed')) tab.click();
                    if (panel.classList.contains('collapsed')) throw new Error('palette did not open');
                    tab.click();
                    if (!panel.classList.contains('collapsed')) throw new Error('palette did not collapse');
                    if (panel.getBoundingClientRect().width > 1) throw new Error('collapsed palette still has width');
                    tab.click();
                    if (panel.classList.contains('collapsed')) throw new Error('palette did not reopen');
                    panel.style.transition = previousTransition;
                    return 'collapsed and reopened';
                });
                check('right inspector slides in and out on medium screens', () => {
                    const panel = doc.getElementById('side-panel');
                    const toggle = doc.getElementById('panel-toggle');
                    const overlay = doc.getElementById('side-panel-overlay');
                    if (!panel || !toggle) throw new Error('no inspector or toggle');
                    const styles = win.getComputedStyle(panel);
                    const width = Math.round(panel.getBoundingClientRect().width);
                    if (styles.position !== 'fixed') throw new Error(`inspector is ${styles.position}, expected overlay`);
                    if (win.getComputedStyle(toggle).display === 'none') throw new Error('inspector toggle is hidden');
                    if (width > 300) throw new Error(`inspector is ${width}px wide`);

                    if (panel.classList.contains('open')) toggle.click();
                    if (panel.classList.contains('open')) throw new Error('inspector did not close');
                    toggle.click();
                    if (!panel.classList.contains('open')) throw new Error('inspector did not open');
                    if (!overlay.classList.contains('visible')) throw new Error('inspector backdrop did not show');
                    toggle.click();
                    if (panel.classList.contains('open')) throw new Error('inspector did not close again');
                    return `overlay, ${width}px`;
                });
                check('pinned inspector stays open and releases the backdrop', () => {
                    const panel = doc.getElementById('side-panel');
                    const pin = doc.getElementById('side-panel-pin');
                    const toggle = doc.getElementById('panel-toggle');
                    const overlay = doc.getElementById('side-panel-overlay');
                    if (!panel || !pin || !toggle || !overlay) throw new Error('missing inspector pin controls');

                    // Normalize the starting state, including any saved pin from
                    // an earlier run in this browser.
                    if (panel.classList.contains('pinned')) pin.click();
                    if (panel.classList.contains('open')) toggle.click();

                    toggle.click();
                    if (!panel.classList.contains('open')) throw new Error('inspector did not open');
                    pin.click();
                    if (!panel.classList.contains('pinned')) throw new Error('pin state did not apply');
                    if (pin.getAttribute('aria-pressed') !== 'true') throw new Error('pin button is not pressed');
                    if (!panel.classList.contains('open')) throw new Error('pinned inspector closed');
                    if (overlay.classList.contains('visible')) throw new Error('pinned inspector still blocks the canvas');

                    toggle.click();
                    if (panel.classList.contains('open')) throw new Error('edge tab did not close the inspector');
                    if (panel.classList.contains('pinned')) throw new Error('closing did not unpin the inspector');
                    return 'pin holds it open without a backdrop';
                });
                check('right-clicking a node offers delete and removes it', () => {
                    const manager = win.nodeManager;
                    win.confirm = () => true;
                    const nodeElement = doc.querySelector('#canvas-content .node');
                    if (!nodeElement) throw new Error('no node on the canvas');
                    nodeElement.dispatchEvent(new win.MouseEvent('contextmenu', {
                        bubbles: true,
                        cancelable: true,
                        clientX: 200,
                        clientY: 200
                    }));
                    const menu = doc.getElementById('canvas-context-menu');
                    if (!menu) throw new Error('no canvas-context-menu element');
                    if (!menu.classList.contains('visible')) {
                        const diagnostics = {
                            hasMenuApi: !!win.nodeContextMenu,
                            searchCanvas: win.nodeSearch?.canvas?.id || null,
                            nodeId: nodeElement.id,
                            knownNode: manager.factory.nodes.some(n => n.id === nodeElement.id)
                        };
                        throw new Error(`node menu did not open (${JSON.stringify(diagnostics)})`);
                    }
                    const before = manager.factory.nodes.length;
                    menu.querySelector('[data-action="delete-node"]').click();
                    const after = manager.factory.nodes.length;
                    if (after !== before - 1) throw new Error(`expected ${before - 1} nodes, got ${after}`);
                    return `${before} -> ${after} node(s)`;
                });
                check('settings sliders reach the generated code', () => {
                    const manager = win.nodeManager;
                    win.confirm = () => true;
                    if (!manager.factory.nodes.length) doc.getElementById('load-sample-tune').click();

                    doc.getElementById('settingsBtn').click();
                    const gain = doc.getElementById('settings-gain');
                    const bpm = doc.getElementById('bpm');
                    if (!gain || !bpm) throw new Error('settings controls missing');

                    gain.value = '0.5';
                    gain.dispatchEvent(new win.Event('change', { bubbles: true }));
                    bpm.value = '140';
                    bpm.dispatchEvent(new win.Event('change', { bubbles: true }));
                    doc.getElementById('saveSettings').click();

                    const code = manager.buildPlayablePattern();
                    if (!/\.gain\(0\.5\)/.test(code)) throw new Error(`no gain in: ${code}`);
                    if (!/^setcpm\(35\)/.test(code)) throw new Error(`no tempo in: ${code}`);

                    // Leave the persisted state clean for the next run.
                    gain.value = '1';
                    gain.dispatchEvent(new win.Event('change', { bubbles: true }));
                    bpm.value = '120';
                    bpm.dispatchEvent(new win.Event('change', { bubbles: true }));
                    doc.getElementById('saveSettings').click();
                    return code.split('\n')[0];
                });

                render();
            }, 5000);
        });
    </script>
</body>
</html>
