# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        # Only publish what the app actually loads. Development notes (docs/),
        # archived modules and scratch test pages stay out of the deploy.
        run: |
          mkdir -p _site/js/nodes
          cp index.html favicon.ico favicon.svg favicon-96x96.png apple-touch-icon.png \
             web-app-manifest-192x192.png web-app-manifest-512x512.png _site/
          cp -R css fonts nodes _site/
          cp js/*.js _site/js/
          cp js/nodes/*.js _site/js/nodes/
          # Legacy modules that are no longer part of the app
          rm -f _site/js/main.js _site/js/ui.js _site/js/layerManager.js \
                _site/js/timeline.js _site/js/settings-manager.js \
                _site/js/tutorialSystem.js _site/js/tutorialConfig.js \
                _site/js/graphNormalizer.js _site/js/fileManager.js \
                _site/js/databaseManager.js _site/js/collectionManager.js \
                _site/js/collectionUI.js _site/js/presets.js \
                _site/js/soundGenerator.js _site/js/audioEngine.js \
                _site/js/notifications.js _site/js/nodeManager.js \
                _site/js/strudel.js _site/js/strudel.mjs \
                _site/js/strudel.esm.min.js _site/js/strudel-core.mjs \
                _site/js/strudel-web.html
          rm -f _site/nodes/.DS_Store
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
